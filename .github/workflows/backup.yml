name: Backup externo

# Backups lógicos (pg_dump) com verificação de restauração em um banco
# descartável. Execute manualmente ou agende no GitHub Actions.
#
# Segredos necessários no repositório:
#   BACKUP_DATABASE_URL        conexão DIRETA do PostgreSQL (sem pooler)
#   NEXT_PUBLIC_SUPABASE_URL   quando o destino for Supabase Storage
#   SUPABASE_SERVICE_ROLE_KEY  quando o destino for Supabase Storage
#   BACKUP_S3_BUCKET / BACKUP_S3_REGION / BACKUP_S3_ACCESS_KEY / BACKUP_S3_SECRET_KEY
#
# Variável opcional:
#   STORAGE_DRIVER=supabase|local (vazio = detecta Supabase pelas credenciais)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-externo
  cancel-in-progress: false

jobs:
  backup:
    name: Backup + verificação de restauração
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version

      - name: Dependências
        run: npm ci

      - name: Prisma Client
        run: npx prisma generate

      - name: Criar backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
        run: npm run backup

      - name: Verificar restauração
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX }}
        run: npm run backup:verify

      - name: Expurgo por retenção
        if: github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
        run: npm run backup:prune
